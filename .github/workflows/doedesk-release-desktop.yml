name: Release desktop build

# One Windows or Linux package, called once per target from doedesk-release.yml.
# Adapted from T3 Code's release-desktop.yml, without its CLI archive. The JS bundle (server, web client,
# Electron main) comes from the `js-bundle` artifact; this job adds the brand
# fonts, builds the native helpers, and packages the app. Windows builds on
# Linux, and a second job runs its native checks on a Windows runner.

on:
  workflow_call:
    inputs:
      label:
        required: true
        type: string
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      arch:
        required: true
        type: string
      rust_target:
        required: true
        type: string
      # Opens the packaged AppImage against a seeded database before uploading it.
      launch_check:
        required: false
        default: false
        type: boolean
      # A runner of the target's platform for the checks this host cannot run.
      verify_runner:
        required: false
        default: ""
        type: string
      version:
        required: true
        type: string
      ref:
        required: true
        type: string

# electron-builder leaves the default arch (x64) out of the unpacked app's
# directory name.
env:
  UNPACKED_DIR: ${{ inputs.platform }}-${{ inputs.arch != 'x64' && format('{0}-', inputs.arch) || '' }}unpacked
  T3CODE_DESKTOP_UPDATE_REPOSITORY: accelerate-sa/doedesk

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.label }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      # checkout's credential cleanup runs submodule foreach even with submodules
      # disabled, which fails on the orphaned gitlinks in the vendored .repos tree.
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ inputs.ref }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      # The release checks come from this workflow's commit, so tags made before
      # the script existed (v0.1.10) are checked the same way.
      - name: Use this workflow's release checks
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$WORKFLOW_SHA"
          git show "$WORKFLOW_SHA:scripts/doedesk-check-release.ts" > scripts/doedesk-check-release.ts

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      # The staged app installs without a lockfile; it reuses
      # this registry metadata and store. A new week starts cold.
      - name: Resolve staged install cache
        id: stage_pnpm
        shell: bash
        run: |
          echo "dir=$RUNNER_TEMP/desktop-stage-pnpm" >> "$GITHUB_OUTPUT"
          echo "prefix=desktop-stage-pnpm-v2-${{ inputs.platform }}-${{ inputs.arch }}-$(date -u +%G-%V)-" >> "$GITHUB_OUTPUT"

      - name: Restore staged install cache
        id: stage_pnpm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.stage_pnpm.outputs.prefix }}

      - name: Mark staged install cache
        shell: bash
        run: mkdir -p "${{ steps.stage_pnpm.outputs.dir }}" && touch "$RUNNER_TEMP/desktop-stage-pnpm.marker"

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/resource-monitor/target/${{ inputs.rust_target }}/release/t3-resource-monitor${{ inputs.platform == 'win' && '.exe' || '' }}
          key: resource-monitor-${{ inputs.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Cache Linux capture helpers
        if: inputs.platform == 'linux'
        id: capture_helper_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/kde-snap-shot/target/${{ inputs.rust_target }}/release/t3-kde-snap-shot
            native/hyprland-snap-shot/target/${{ inputs.rust_target }}/release/t3-hyprland-snap-shot
          key: linux-capture-helpers-${{ inputs.rust_target }}-${{ hashFiles('native/kde-snap-shot/Cargo.lock', 'native/kde-snap-shot/Cargo.toml', 'native/kde-snap-shot/src/**', 'native/hyprland-snap-shot/Cargo.lock', 'native/hyprland-snap-shot/Cargo.toml', 'native/hyprland-snap-shot/src/**', 'native/hyprland-snap-shot/protocols/**') }}

      # electron-builder checks these archives against pinned SHA-256s and
      # downloads again on a mismatch, so only raw archives are cached.
      - name: Cache Linux packaging tool archives
        if: inputs.platform == 'linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron-builder/appimage@*/appimage-tools-runtime-*.tar.gz
            ~/.cache/electron-builder/fpm@*/fpm-*.7z
            ~/.cache/electron-builder/7zip@*/7zip-linux-*.tar.gz
          key: electron-builder-linux-tools-${{ inputs.arch }}-${{ hashFiles('node_modules/.pnpm/app-builder-lib@*/node_modules/app-builder-lib/out/toolsets/linux.js', 'node_modules/.pnpm/app-builder-lib@*/node_modules/app-builder-lib/out/toolsets/7zip.js') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true' || (inputs.platform == 'linux' && steps.capture_helper_cache.outputs.cache-hit != 'true')
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ inputs.rust_target }}

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ inputs.version }}"

      # The artifact root is `apps/`, so extracting into `apps` restores
      # apps/server/dist and apps/desktop/dist-electron at their build paths.
      - name: Download JS bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-bundle
          path: apps

      - name: Install cargo-xwin
        if: inputs.platform == 'win' && steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-xwin@0.23.1

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo ${{ inputs.platform == 'win' && 'xwin build' || 'build' }} --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ inputs.rust_target }}"

      - uses: ./.github/actions/setup-apt-mirrors
        if: inputs.platform == 'linux'

      - name: Install Linux desktop build libraries
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config libgtk-3-0t64 libnss3 libasound2t64 libgbm1 xvfb
          command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1 || sudo apt-get install -y imagemagick

      # Thmanyah Serif's licence forbids redistributing the files, so they come
      # from secrets (split in parts: a secret holds at most 48 KB), stay in the
      # runner's temp folder, and reach only the packaged app. The JS bundle
      # artifact was uploaded without them; they go back where the web build put
      # them (see apps/web/vite/brandFonts.ts).
      - name: Add brand fonts
        shell: bash
        env:
          PART_01: ${{ secrets.DOEDESK_BRAND_FONTS_01 }}
          PART_02: ${{ secrets.DOEDESK_BRAND_FONTS_02 }}
          PART_03: ${{ secrets.DOEDESK_BRAND_FONTS_03 }}
          PART_04: ${{ secrets.DOEDESK_BRAND_FONTS_04 }}
          PART_05: ${{ secrets.DOEDESK_BRAND_FONTS_05 }}
          PART_06: ${{ secrets.DOEDESK_BRAND_FONTS_06 }}
          PART_07: ${{ secrets.DOEDESK_BRAND_FONTS_07 }}
          PART_08: ${{ secrets.DOEDESK_BRAND_FONTS_08 }}
          PART_09: ${{ secrets.DOEDESK_BRAND_FONTS_09 }}
          PART_10: ${{ secrets.DOEDESK_BRAND_FONTS_10 }}
          PART_11: ${{ secrets.DOEDESK_BRAND_FONTS_11 }}
          PART_12: ${{ secrets.DOEDESK_BRAND_FONTS_12 }}
        run: |
          set -euo pipefail
          fonts="$RUNNER_TEMP/doedesk-brand-fonts"
          mkdir -p "$fonts"
          for i in 01 02 03 04 05 06 07 08 09 10 11 12; do
            part="PART_$i"
            printf '%s' "${!part}"
          done | base64 -d | xz -d | tar -x -C "$fonts"
          count=$(find "$fonts" -name 'thmanyah-serif-*.otf' | wc -l)
          if [[ "$count" -ne 6 ]]; then
            echo "::error::Expected 6 brand fonts from the DOEDESK_BRAND_FONTS_* secrets, found $count."
            exit 1
          fi
          grep -q 'data-brand-fonts' apps/server/dist/client/index.html
          mkdir -p apps/server/dist/client/brand-fonts
          cp "$fonts"/*.otf apps/server/dist/client/brand-fonts/
          echo "DOEDESK_BRAND_FONTS_DIR=$fonts" >> "$GITHUB_ENV"

      - name: Build desktop artifact
        shell: bash
        env:
          pnpm_config_cache_dir: ${{ steps.stage_pnpm.outputs.dir }}/cache
          pnpm_config_store_dir: ${{ steps.stage_pnpm.outputs.dir }}/store
          pnpm_config_prefer_offline: "true"
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: true
          T3CODE_DESKTOP_REUSE_LINUX_CAPTURE_HELPERS: ${{ steps.capture_helper_cache.outputs.cache-hit == 'true' }}
        run: |
          args=(
            --platform "${{ inputs.platform }}"
            --target "${{ inputs.target }}"
            --arch "${{ inputs.arch }}"
            --build-version "${{ inputs.version }}"
            --skip-build
            --keep-stage
            --verbose
          )
          if [[ "${{ inputs.platform }}" == "win" ]]; then
            # No --wsl-runtime: T3 Code embeds its Linux CLI archive for the WSL backend, but
            # DoeDesk's server loads sharp, which a Node single executable cannot. The Windows
            # app runs agents on Windows itself.
            # WINDOWS CODE SIGNING: DoeDesk has no Windows certificate yet, so the
            # installer is unsigned and SmartScreen warns on first run. To sign,
            # add the certificate's secrets, export what scripts/lib/windows-jsign.ts
            # and createBuildConfig in scripts/build-desktop-artifact.ts read, and
            # pass --signed here.
            echo "Windows signing disabled: no certificate configured."
          fi
          vp run dist:desktop:artifact "${args[@]}"

      - name: Check staged install cache for new content
        id: stage_pnpm_changed
        shell: bash
        run: |
          dir="${{ steps.stage_pnpm.outputs.dir }}"
          new=$(find "$dir/cache/v12" "$dir/store/v11/files" -type f -newer "$RUNNER_TEMP/desktop-stage-pnpm.marker" 2>/dev/null | wc -l | tr -d ' ')
          echo "changed=$([[ "$new" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Save staged install cache
        if: steps.stage_pnpm_changed.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.stage_pnpm.outputs.dir }}
          key: ${{ steps.stage_pnpm_cache.outputs.cache-primary-key }}

      # The fonts and the update repository, read from the packaged app itself:
      # the AppImage's contents, or the unpacked Windows app the installer holds.
      - name: Check packaged app
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.platform }}" == "linux" ]]; then
            appimage=$(ls "$GITHUB_WORKSPACE"/release/*.AppImage)
            chmod +x "$appimage"
            (cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null)
            resources="$RUNNER_TEMP/squashfs-root/resources"
          else
            resources=$(ls -d "${TMPDIR:-/tmp}"/t3code-desktop-${{ inputs.platform }}-stage-*/app/dist/"$UNPACKED_DIR"/resources)
          fi
          node scripts/doedesk-check-release.ts payload --resources "$resources" \
            --update-repository "$T3CODE_DESKTOP_UPDATE_REPOSITORY" --fonts "$DOEDESK_BRAND_FONTS_DIR"

      # A build can package fine and still not open. This launches the shipped AppImage.
      - name: Launch check
        if: inputs.launch_check
        run: |
          xvfb-run -a node scripts/smoke-desktop-app.ts --artifacts-dir "$RUNNER_TEMP/desktop-launch-check" \
            --executable "$RUNNER_TEMP/squashfs-root/doedesk"

      - name: Upload launch check output
        if: failure() && inputs.launch_check
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-launch-check-${{ inputs.platform }}-${{ inputs.arch }}
          path: ${{ runner.temp }}/desktop-launch-check
          if-no-files-found: ignore
          retention-days: 3

      # The verify job runs what this host could not: the packaged natives. Its
      # script is bundled so that job needs no install. The unpacked app holds the
      # brand fonts, so this artifact lives one day.
      - name: Stage verification inputs
        if: inputs.verify_runner != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify
          unpacked=$(ls -d "${TMPDIR:-/tmp}"/t3code-desktop-${{ inputs.platform }}-stage-*/app/dist/"$UNPACKED_DIR")
          tar -C "$(dirname "$unpacked")" -cf verify/unpacked.tar "$(basename "$unpacked")"
          esbuild=scripts/node_modules/.bin/esbuild
          banner="import{createRequire as __cr}from'node:module';const require=__cr(import.meta.url);"
          "$esbuild" scripts/verify-windows-desktop-artifact.ts --bundle --platform=node --format=esm \
            --target=node24 --define:import.meta.main=false --banner:js="$banner" \
            --outfile=verify/verify-windows-desktop-artifact.mjs

      - name: Upload verification inputs
        if: inputs.verify_runner != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-${{ inputs.platform }}-${{ inputs.arch }}
          path: verify/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for file in release/*.AppImage release/*.deb release/*.exe release/*.blockmap release/latest*.yml; do
            cp "$file" release-publish/
          done
          ls -l release-publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ inputs.platform }}-${{ inputs.arch }}
          path: release-publish/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  verify:
    name: Verify
    needs: [build]
    if: inputs.verify_runner != ''
    runs-on: ${{ inputs.verify_runner }}
    timeout-minutes: 15
    steps:
      - name: Download verification inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify-${{ inputs.platform }}-${{ inputs.arch }}
          path: verify

      - name: Verify packaged natives
        shell: bash
        run: |
          set -euo pipefail
          tar -C verify -xf verify/unpacked.tar
          node verify/verify-windows-desktop-artifact.mjs \
            --app-dir "$(cygpath -w "$PWD/verify/$UNPACKED_DIR")" \
            --arch "${{ inputs.arch }}" --build-version "${{ inputs.version }}" --verbose

      # cargo-xwin links this binary on Linux, and nothing else runs it before users do.
      - name: Smoke-test resource monitor
        shell: bash
        env:
          MONITOR: verify/${{ env.UNPACKED_DIR }}/resources/resource-monitor/t3-resource-monitor.exe
          EXPECTED_ARCH: ${{ inputs.arch == 'arm64' && 'aarch64' || 'x86_64' }}
        run: |
          node --input-type=module <<'EOF'
          import { spawn } from "node:child_process";
          const monitor = spawn(process.env.MONITOR, { stdio: ["pipe", "pipe", "inherit"] });
          monitor.stdout.setEncoding("utf8");
          let output = "";
          const exited = new Promise((resolve) => monitor.on("close", resolve));
          const hello = await new Promise((resolve, reject) => {
            monitor.on("error", reject);
            monitor.on("close", () => reject(new Error(`Resource monitor exited before hello: ${output}`)));
            monitor.stdout.on("data", (chunk) => {
              output += chunk;
              const end = output.indexOf("\n");
              if (end !== -1) resolve(JSON.parse(output.slice(0, end)));
            });
          });
          if (hello.type !== "hello" || hello.arch !== process.env.EXPECTED_ARCH) {
            throw new Error(`Unexpected hello: ${JSON.stringify(hello)}`);
          }
          const send = (message) => monitor.stdin.write(`${JSON.stringify({ version: hello.version, ...message })}\n`);
          send({ type: "configure", rootPid: process.pid, sampleIntervalMs: 1000 });
          send({ type: "sampleNow", requestId: "verify" });
          monitor.stdin.end();
          const exitCode = await exited;
          const sample = output
            .split("\n")
            .filter((line) => line.trim())
            .map((line) => JSON.parse(line))
            .find((message) => message.requestId === "verify");
          if (exitCode !== 0 || sample?.type !== "snapshot" || !sample.processes.some((p) => p.pid === process.pid)) {
            throw new Error(`Resource monitor exited ${exitCode} with: ${output}`);
          }
          console.log(`Resource monitor sampled ${sample.scannedProcessCount} processes.`);
          EOF
